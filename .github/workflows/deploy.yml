# Workflow otomatisasi build dan deploy FormQR Studio ke GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

# Izin penulisan konten ke branch gh-pages
permissions:
  contents: write

# Batalkan antrean yang berjalan bersamaan agar hemat resource
concurrency:
  group: 'gh-pages-deploy'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalasi dependensi
        run: npm ci

      - name: Validasi Quality Gate smoke test
        run: npm test

      - name: Build artefak produksi
        run: npm run build

      - name: Deploy artefak ke branch gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
